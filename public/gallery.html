    <button type="button" class="lightbox-btn lightbox-prev" aria-label="IepriekÅ¡Ä“jais attÄ“ls">&#8249;</button>

  <script>
    (function setupGalleryLightbox() {
      const images = Array.from(document.querySelectorAll('.photo img'));
      const lightbox = document.querySelector('.gallery-lightbox');
      const media = lightbox?.querySelector('.gallery-lightbox-media');
      const closeButton = lightbox?.querySelector('.lightbox-close');
      const prevButton = lightbox?.querySelector('.lightbox-prev');
      const nextButton = lightbox?.querySelector('.lightbox-next');
      if (!images.length || !lightbox || !media || !closeButton || !prevButton || !nextButton) {
        return;
      }

      let activeIndex = 0;

      function updateMedia() {
        const image = images[activeIndex];
        if (!image) {
          return;
        }
        media.src = image.currentSrc || image.src;
        media.alt = image.alt || '';
      }

      function open(index) {
        activeIndex = index;
        updateMedia();
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.classList.add('lightbox-open');
      }

      function close() {
        lightbox.classList.remove('is-open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('lightbox-open');
        media.removeAttribute('src');
      }

      function showPrevious() {
        activeIndex = (activeIndex - 1 + images.length) % images.length;
        updateMedia();
      }

      function showNext() {
        activeIndex = (activeIndex + 1) % images.length;
        updateMedia();
      }

      images.forEach((image, index) => {
        image.addEventListener('click', () => open(index));
      });

      closeButton.addEventListener('click', close);
      prevButton.addEventListener('click', showPrevious);
      nextButton.addEventListener('click', showNext);

      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) {
          close();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (!lightbox.classList.contains('is-open')) {
          return;
        }
        if (event.key === 'Escape') {
          close();
          return;
        }
        if (event.key === 'ArrowLeft') {
          showPrevious();
          return;
        }
        if (event.key === 'ArrowRight') {
          showNext();
        }
      });
    })();
  </script>
