<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pazīt Tevi | Galerija</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f0ff;
        --card: #ffffff;
        --text: #2f1f45;
        --line: rgba(62, 40, 96, 0.15);
        --muted: #7f7991;
        --accent: #6e55d6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Manrope", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .gallery-page {
        width: min(1280px, calc(100% - 2rem));
        margin: 1.2rem auto 2rem;
      }

      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(2.1rem, 5.6vw, 3.1rem);
        margin: 0 0 1rem;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 0.55rem;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 600;
        transition: color 180ms ease;
      }

      .back-link:hover {
        color: var(--accent);
      }

      .photos {
        columns: 4 260px;
        column-gap: 0.55rem;
      }

      .photo {
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--card);
        box-shadow: 0 12px 22px rgba(54, 33, 83, 0.12);
        opacity: 0;
        transform: translateY(18px) scale(0.98);
        animation: reveal 800ms ease forwards;
        overflow: hidden;
        break-inside: avoid;
        margin: 0 0 0.55rem;
      }

      .photo img {
        width: 100%;
        height: auto;
        object-fit: cover;
        border-radius: 16px;
        transition: transform 0.4s ease;
      }

      .photo:hover img {
        transform: scale(1.04);
      }

      @keyframes reveal {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-width: 1100px) {
        .photos {
          columns: 3 240px;
        }
      }

      @media (max-width: 760px) {
        .photos {
          columns: 2 170px;
        }
      }
    </style>
  </head>
